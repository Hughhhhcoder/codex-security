name: node-release-pr

on:
  workflow_run:
    workflows: ["node-ci", "node-github-release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check whether a patch release PR is needed without creating one
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: node-release-pr
  queue: max

jobs:
  propose:
    if: >-
      github.repository == 'openai/codex-security' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.name == 'node-ci' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push') ||
      github.event.workflow_run.name == 'node-github-release')))
    name: propose patch release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout release automation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/heads/main

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Create release App token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write

      - name: Propose the next patch release
        env:
          GH_TOKEN: ${{ vars.RELEASE_APP_CLIENT_ID == '' && github.token || steps.release-app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            node sdk/typescript/scripts/patch-release-pr.mjs --dry-run
          else
            node sdk/typescript/scripts/patch-release-pr.mjs
          fi
