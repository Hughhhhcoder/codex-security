name: node-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundled-mcp-live-smoke:
    name: Require manually initiated bundled MCP smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read

    steps:
      - name: Verify smoke-test results for bundled MCP changes
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullRequest = context.payload.pull_request;
            const bundledMcpPrefix = "sdk/typescript/_bundled_plugin/mcp/";
            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });

            if (!changedFiles.some(({ filename, previous_filename: previousFilename }) =>
              filename.startsWith(bundledMcpPrefix) ||
              previousFilename?.startsWith(bundledMcpPrefix)
            )) {
              core.info("No bundled MCP files changed; a manual smoke test is not required.");
              return;
            }

            const headSha = pullRequest.head.sha;
            const requiredContexts = [
              "codex-security/live-smoke-linux",
              "codex-security/live-smoke-windows",
            ];
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner,
              repo,
              ref: headSha,
              per_page: 100,
            });
            const latestStatuses = new Map();

            for (const status of statuses) {
              if (requiredContexts.includes(status.context) && !latestStatuses.has(status.context)) {
                latestStatuses.set(status.context, status.state);
              }
            }

            const missingOrFailed = requiredContexts.filter(
              (statusContext) => latestStatuses.get(statusContext) !== "success",
            );

            if (missingOrFailed.length > 0) {
              for (const statusContext of missingOrFailed) {
                core.error(`${statusContext}: ${latestStatuses.get(statusContext) ?? "not run"}`);
              }
              core.setFailed(
                `Bundled MCP changes require successful manually initiated Linux and Windows smoke scans for ${headSha}. ` +
                `Run: gh workflow run live-scan-smoke.yml --repo ${owner}/${repo} --ref main --field pull_request=${pullRequest.number}`,
              );
              return;
            }

            core.info(`Linux and Windows manual smoke tests passed for ${headSha}.`);

  test:
    name: ${{ matrix.os }} / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.13.0"]
        include:
          - os: ubuntu-latest
            node: "24.0.0"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26.0.0"
          - os: ubuntu-latest
            node: "26"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: sdk/typescript/package.json
          cache: true
          cache_dependency_path: sdk/typescript/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: pnpm --dir sdk/typescript install --frozen-lockfile

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        continue-on-error: true
        run: pnpm --dir sdk/typescript run audit:prod

      - name: Typecheck
        run: pnpm --dir sdk/typescript run types

      - name: Prepare private Windows test root
        if: runner.os == 'Windows'
        id: windows-temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:USERPROFILE '.codex-security-ci-temp'
          New-Item -ItemType Directory -Path $path -Force | Out-Null
          $sid = (whoami /user /fo csv /nh | ConvertFrom-Csv -Header Name, Sid).Sid
          & icacls $path /inheritance:r /grant:r "*${sid}:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not secure the Windows test root' }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Test
        timeout-minutes: 10
        env:
          TEMP: ${{ steps.windows-temp.outputs.path || runner.temp }}
          TMP: ${{ steps.windows-temp.outputs.path || runner.temp }}
          TMPDIR: ${{ steps.windows-temp.outputs.path || runner.temp }}
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: ${{ runner.environment == 'github-hosted' && runner.os == 'Windows' && 'true' || 'false' }}
        run: pnpm --dir sdk/typescript run test

      - name: Check formatting
        run: pnpm --dir sdk/typescript run format

      - name: Build
        run: pnpm --dir sdk/typescript run build

      - name: Pack
        working-directory: sdk/typescript
        run: pnpm pack --pack-destination ../../dist

      - name: Inspect package
        working-directory: sdk/typescript
        shell: bash
        run: pnpm run check:package ../../dist/*.tgz

      - name: Smoke-test Node.js runtime
        working-directory: sdk/typescript
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --eval '
            import { CodexSecurity } from "@openai/codex-security";

            if (typeof CodexSecurity !== "function") {
              throw new Error("The SDK does not export CodexSecurity.");
            }
          '
          node bin/codex-security.mjs --version
          node bin/codex-security.mjs --help

  windows-test:
    name: windows-latest / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }} / tests-${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
        shard: [1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Set up pnpm
        run: npm install --global pnpm@11.9.0 --no-audit --no-fund

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile

      - name: Prepare private Windows test root
        id: windows-temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:USERPROFILE '.codex-security-ci-temp'
          New-Item -ItemType Directory -Path $path -Force | Out-Null
          $sid = (whoami /user /fo csv /nh | ConvertFrom-Csv -Header Name, Sid).Sid
          & icacls $path /inheritance:r /grant:r "*${sid}:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not secure the Windows test root' }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Test shard ${{ matrix.shard }}
        timeout-minutes: 10
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
        run: node sdk/typescript/scripts/run-windows-ci-tests.mjs ${{ matrix.shard }}

      - name: Typecheck
        if: matrix.shard == 7
        working-directory: sdk/typescript
        run: pnpm run types

      - name: Check formatting
        if: matrix.shard == 7
        working-directory: sdk/typescript
        run: pnpm run format

  windows-verify:
    name: windows-latest / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }} / verify
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Set up pnpm
        run: npm install --global pnpm@11.9.0 --no-audit --no-fund

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: sdk/typescript
        run: pnpm run build

      - name: Pack
        working-directory: sdk/typescript
        run: pnpm pack --pack-destination ../../dist

      - name: Inspect package
        working-directory: sdk/typescript
        shell: bash
        run: pnpm run check:package ../../dist/*.tgz

      - name: Smoke-test Node.js runtime
        working-directory: sdk/typescript
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --eval '
            import { CodexSecurity } from "@openai/codex-security";

            if (typeof CodexSecurity !== "function") {
              throw new Error("The SDK does not export CodexSecurity.");
            }
          '
          node bin/codex-security.mjs --version
          node bin/codex-security.mjs --help

  windows:
    name: windows-latest / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }}
    runs-on: ubuntu-latest
    if: always()
    needs: [bundled-mcp-live-smoke, windows-test, windows-verify]
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]

    steps:
      - name: Require every Windows coverage job
        if: needs.bundled-mcp-live-smoke.result != 'success' || needs.windows-test.result != 'success' || needs.windows-verify.result != 'success'
        run: exit 1
